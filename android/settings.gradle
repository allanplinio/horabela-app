rootProject.name = 'HoraBela'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
    }
  }
}

apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle");
useExpoModules()

// Try to apply native_modules.gradle from @react-native-community/cli-platform-android if present
def cliPlatformAndroidPackageJson = ["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()
def cliPlatformAndroidDir = new File(cliPlatformAndroidPackageJson).getParentFile()
def nativeModulesGradleFile = new File(cliPlatformAndroidDir, "native_modules.gradle")
if (nativeModulesGradleFile.exists()) {
  apply from: nativeModulesGradleFile
  applyNativeModulesSettingsGradle(settings)
} else {
  println "[settings.gradle] Warning: native_modules.gradle not found at ${nativeModulesGradleFile}. Skipping applyNativeModulesSettingsGradle."
}

include ':app'
includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile())
